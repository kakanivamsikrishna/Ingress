---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeploy-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flight
  template:
    metadata:
      labels:
        app: flight
    spec:
      containers:
        - name: mycontainer
          image: vamsikrishnakakani/vamsi-repo:flight
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: myservice-1
spec:
  selector:
    app: flight
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

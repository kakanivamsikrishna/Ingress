---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeploy-3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatra
  template:
    metadata:
      labels:
        app: yatra
    spec:
      containers:
        - name: mycontainer
          image: vamsikrishnakakani/vamsi-repo:yatra
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: myservice-3
spec:
  selector:
    app: yatra
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

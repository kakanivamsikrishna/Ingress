---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeploy-4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: foodapp
  template:
    metadata:
      labels:
        app: foodapp
    spec:
      containers:
        - name: mycontainer
          image: vamsikrishnakakani/vamsi-repo:foodapp
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: myservice-4
spec:
  selector:
    app: foodapp
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

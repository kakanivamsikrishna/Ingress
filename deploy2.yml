---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeploy-2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pubg
  template:
    metadata:
      labels:
        app: pubg
    spec:
      containers:
        - name: mycontainer
          image: vamsikrishnakakani/vamsi-repo:pubg
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: myservice-2
spec:
  selector:
    app: pubg
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
